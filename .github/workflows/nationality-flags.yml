name: Nationality flags migration

on:
  push:
    branches:
      - fix/nationality-flags-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip nationality-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply nationality source fixups
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'js/data/nationalities.js';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["HND: 'HN', HRV: 'HR', HUN: 'HU', IRL: 'IE', ISL: 'IS'", "HND: 'HN', HRV: 'HR', HUN: 'HU', IRI: 'IR', IRN: 'IR', IRL: 'IE', ISL: 'IS'"],
            ["HT: 'haiti', HU: 'hungary', IE: 'ireland', IL: 'israel'", "HT: 'haiti', HU: 'hungary', IE: 'ireland', IL: 'israel', IR: 'iran'"],
            ["['countryCode', player.countryCode],\n    ['flagCode', player.flagCode],\n    ['nationalityCode', player.nationalityCode],\n    ['nation', player.nation],\n    ['nationality', player.nationality],\n    ['country', player.country],", "['nationalityCode', player.nationalityCode],\n    ['nation', player.nation],\n    ['nationality', player.nationality],\n    ['country', player.country],\n    ['countryCode', player.countryCode],\n    ['flagCode', player.flagCode],"],
            ["['ireland', 'IE'], ['republic of ireland', 'IE'], ['irish', 'IE'],\n  ['scotland', 'GB-SCT'], ['scottish', 'GB-SCT'],\n  ['wales', 'GB-WLS'], ['welsh', 'GB-WLS'],\n  ['northern ireland', 'GB-NIR'], ['northern irish', 'GB-NIR'],", "['northern ireland', 'GB-NIR'], ['northern irish', 'GB-NIR'],\n  ['republic of ireland', 'IE'], ['ireland', 'IE'], ['irish', 'IE'],\n  ['scotland', 'GB-SCT'], ['scottish', 'GB-SCT'],\n  ['wales', 'GB-WLS'], ['welsh', 'GB-WLS'],"],
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`Expected nationality source fragment not found: ${from}`);
            text = text.replace(from, to);
          }
          fs.writeFileSync(file, text);
          NODE

      - name: Regenerate normalized database and audit
        run: |
          node scripts/migrate-normalized-database.mjs
          node scripts/audit-nationalities.mjs

      - name: Syntax checks
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Commit generated database and audit
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/nationalities.js data/databases/hungary-nb1-2025-26/players.normalized.json data/databases/hungary-nb1-2025-26/normalization-report.json data/databases/hungary-nb1-2025-26/nationality-audit-report.json
          git commit -m "Nemzetiségi adatbázis v2 generálása [skip nationality-build]"
          git push
