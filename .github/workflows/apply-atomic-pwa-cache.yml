name: Apply atomic PWA cache

on:
  push:
    branches:
      - fix/atomic-pwa-cache
    paths:
      - .github/workflows/apply-atomic-pwa-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-pwa-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply atomic service worker
        shell: bash
        run: |
          cat > sw.js <<'EOF'
          // Atomikus, build-azonosítós PWA-cache. A cache-nevet a service worker tartalma határozza meg.
          const LEGACY_CACHE_PREFIX = 'fociskartyak-2026-';
          const CACHE_PREFIX = 'fociskartyak-2026-build-';
          const META_CACHE = 'fociskartyak-2026-meta';
          const ACTIVE_META_KEY = new URL('./__pwa-active-cache__', self.location.href).href;
          const PENDING_META_KEY = new URL('./__pwa-pending-cache__', self.location.href).href;

          const CORE_SHELL = Object.freeze([
            './index.html',
            './mobil.html',
            './manifest.webmanifest',
            './css/style.css',
            './css/ux.css',
            './css/matchday.css',
            './css/opponents.css',
            './css/pwa.css',
            './css/mobile-experience.css',
            './css/mobile-overlay-fix.css',
            './css/player-profile.css',
            './css/focus-experience.css',
            './css/mobile-selection-fix.css',
            './css/duel-emphasis.css',
            './css/phase-refinements.css',
            './css/visual-system.css',
            './css/visual-settings-persistence.css',
            './css/legal-ui.css',
            './css/visual-hierarchy.css',
            './css/category-picker.css',
            './css/deck-selection-menu.css',
            './css/quick-match-card-controls.css',
            './css/help-popover.css',
            './css/federation-teams.css',
            './css/nationality-flags.css',
            './css/tournament-mode.css',
            './css/i18n.css',
            './js/app/configuration.js',
            './js/services/storage-service.js',
            './js/services/asset-service.js',
            './js/services/save-service.js',
            './js/services/season-save-service.js',
            './js/services/turn-timing-service.js',
            './js/app/session-lifecycle-service.js',
            './js/app/menu-controller.js',
            './js/app/result-controller.js',
            './js/app/round-controller.js',
            './js/branding.js',
            './js/i18n.js',
            './js/pwa.js',
            './js/bootstrap.js',
            './js/database/season-model.js',
            './js/database/database-registry.js',
            './js/database/database-service.js',
            './js/database/season-service.js',
            './js/models/player-model.js',
            './js/data/federations.js',
            './js/data/nationalities.js',
            './js/data/complete-cards.js',
            './js/data/club-enrichment.js',
            './js/data/club-stat-patches.js',
            './js/data/verified-player-corrections.js',
            './js/data/categories.js',
            './js/data/players.js',
            './js/domain/federation-domain.js',
            './js/domain/deck-selection-domain.js',
            './js/domain/quick-match-domain.js',
            './js/tournament/tournament-domain.js',
            './js/services/deck-selection-storage-service.js',
            './js/services/quick-match-storage-service.js',
            './js/services/tournament-storage-service.js',
            './js/ui/deck-selection-menu-component.js',
            './js/ui/help-popover-component.js',
            './js/ui/ui-enhancement-pipeline.js',
            './js/quick-match-card-controls.js',
            './js/deck-selection.js',
            './js/game/game-mode-factory.js',
            './js/game/game-runtime.js',
            './js/engine.js',
            './js/penalties.js',
            './js/ai.js',
            './js/banter.js',
            './js/ui/dom-primitives.js',
            './js/ui/card-component.js',
            './js/ui/flag-component.js',
            './js/ui/scoreboard-component.js',
            './js/ui/attribute-picker-component.js',
            './js/ui.js',
            './js/ux.js',
            './js/ux-fixes.js',
            './js/nationality-ui-enhancement.js',
            './js/focus-experience.js',
            './js/matchday.js',
            './js/opponents.js',
            './js/mobile-experience.js',
            './js/category-picker.js',
            './js/player-profile.js',
            './js/reliability-fixes.js',
            './js/usability-fixes.js',
            './js/visual-settings-persistence.js',
            './js/visual-system.js',
            './js/visual-hierarchy.js',
            './js/gameplay-experience.js',
            './js/recent-duels-experience.js',
            './js/gameplay-polish.js',
            './js/playability-visual-upgrade.js',
            './js/legal-ui.js',
            './js/tournament-mode.js',
            './js/tournament-cup-experience.js',
            './js/tournament/cup-atmosphere.js',
            './js/tournament-rapid-upgrade.js',
            './js/tournament-flow-upgrade.js',
            './js/tournament-experience-v2.js',
            './js/tournament/tournament-experience-v2-presets.js',
            './js/main.js',
            './locales/hu.json',
            './locales/en.json',
            './data/databases/registry.json',
            './data/databases/hungary-nb1-2025-26/manifest.json',
            './data/databases/hungary-nb1-2025-26/players.normalized.json',
            './src/assets/placeholders/player-silhouette.svg',
            './src/assets/placeholders/club-badge.svg',
            './src/assets/placeholders/app-icon.svg'
          ]);

          const OPTIONAL_ASSETS = Object.freeze([
            './data/databases/hungary-nb1-2025-26/normalization-report.json',
            './data/databases/hungary-nb1-2025-26/nationality-audit-report.json',
            './data/databases/hungary-nb1-2025-26/federation-audit-report.json',
            './data/players.json',
            './data/club-official-enrichment.json',
            './data/club-official-enrichment-2.json',
            './data/club-official-enrichment-3-paks-nyir.json',
            './data/club-official-enrichment-4-ujpest.json',
            './data/club-official-enrichment-5-other.json',
            './data/club-official-enrichment-6-eto-puskas.json',
            './data/club-official-enrichment-7-kisvarda-selected10.json',
            './data/club-official-enrichment-8-kisvarda-selected10.json',
            './data/club-official-enrichment-9-kisvarda-selected10.json',
            './data/club-official-enrichment-10-kisvarda-final8.json',
            './data/club-official-enrichment-11-kisvarda-completion.json',
            './data/club-official-enrichment-12-dvtk-completion.json',
            './data/club-official-enrichment-13-mtk-completion.json',
            './data/club-official-enrichment-14-nyiregyhaza-completion.json',
            './data/club-official-enrichment-15-nyiregyhaza-nationalities.json',
            './data/club-official-enrichment-16-kazincbarcika-completion.json',
            './data/club-official-enrichment-17-ujpest-completion.json',
            './data/club-official-enrichment-18-paks-completion.json',
            './data/club-official-enrichment-19-zte-completion.json',
            './data/club-official-enrichment-20-puskas-completion.json',
            './data/club-official-enrichment-21-eto-completion.json',
            './data/club-official-enrichment-22-kisvarda-nationalities.json',
            './data/club-official-enrichment-23-final-missing-basic.json',
            './data/club-official-enrichment-24-dvtk-heights.json',
            './data/club-official-enrichment-25-all-club-heights.json',
            './data/club-official-corrections.json',
            './data/club-official-corrections-2.json',
            './data/club-official-corrections-3.json',
            './data/club-official-corrections-4-kisvarda-selected10-2.json',
            './data/club-official-corrections-5-puskas.json',
            './data/club-official-stat-patches-kisvarda.json',
            './data/club-official-stat-patches-kisvarda-selected10.json',
            './data/club-official-stat-patches-kisvarda-selected10-2.json',
            './data/club-official-stat-patches-kisvarda-selected10-3.json',
            './data/club-official-stat-patches-kisvarda-final8.json',
            './data/club-official-stat-patches-ferencvaros.json',
            './data/club-official-stat-patches-dvtk.json',
            './data/club-official-stat-patches-mtk.json',
            './data/club-official-stat-patches-nyiregyhaza.json',
            './data/club-official-stat-patches-kazincbarcika.json',
            './data/club-official-stat-patches-ujpest.json',
            './data/club-official-stat-patches-zte.json',
            './data/club-official-stat-patches-puskas.json',
            './data/club-official-sources.json',
            './assets/flags/gb-eng.svg',
            './assets/flags/gb-sct.svg',
            './assets/flags/gb-wls.svg',
            './assets/flags/gb-nir.svg',
            './assets/federations/federation-europe.svg',
            './assets/federations/federation-africa.svg',
            './assets/federations/federation-south-america.svg',
            './assets/federations/federation-concacaf.svg',
            './assets/federations/federation-asia.svg',
            './assets/federations/federation-oceania.svg',
            './src/assets/licenses/assets-licenses.json',
            './assets/qr/mobil-eleres.svg'
          ]);

          let currentCacheName = null;

          const managedCache = name => name !== META_CACHE && name.startsWith(LEGACY_CACHE_PREFIX);
          const responseText = async response => response ? response.text() : null;

          async function readMeta(key) {
            const cache = await caches.open(META_CACHE);
            return responseText(await cache.match(key));
          }

          async function writeMeta(key, value) {
            const cache = await caches.open(META_CACHE);
            await cache.put(key, new Response(String(value), { headers: { 'content-type': 'text/plain' } }));
          }

          async function clearMeta(key) {
            const cache = await caches.open(META_CACHE);
            await cache.delete(key);
          }

          async function sha256Hex(value) {
            const data = new TextEncoder().encode(value);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
          }

          async function candidateCacheName() {
            const response = await fetch(new Request(self.location.href, { cache: 'no-store' }));
            if (!response.ok) throw new Error(`A service worker buildazonosítója nem olvasható: ${response.status}`);
            const source = await response.text();
            const signature = JSON.stringify({ source, core: CORE_SHELL, optional: OPTIONAL_ASSETS });
            return `${CACHE_PREFIX}${(await sha256Hex(signature)).slice(0, 16)}`;
          }

          async function resolveActiveCacheName() {
            if (currentCacheName) return currentCacheName;
            const mapped = await readMeta(ACTIVE_META_KEY);
            const keys = await caches.keys();
            if (mapped && keys.includes(mapped)) {
              currentCacheName = mapped;
              return mapped;
            }
            const candidates = keys.filter(name => name.startsWith(CACHE_PREFIX));
            currentCacheName = candidates.at(-1) ?? null;
            return currentCacheName;
          }

          async function matchActive(request) {
            const name = await resolveActiveCacheName();
            if (!name) return null;
            return (await caches.open(name)).match(request);
          }

          async function cacheResponse(request, response) {
            if (!response?.ok) return response;
            try {
              const name = await resolveActiveCacheName();
              if (name) await (await caches.open(name)).put(request, response.clone());
            } catch (error) {
              console.warn('[pwa] A sikeres hálózati válasz gyorsítótárazása kimaradt:', error);
            }
            return response;
          }

          async function networkFirst(request) {
            try {
              return await cacheResponse(request, await fetch(request));
            } catch {
              return (await matchActive(request)) || Response.error();
            }
          }

          async function cacheFirstWithRefresh(request, event) {
            const cached = await matchActive(request);
            const refresh = fetch(request)
              .then(response => cacheResponse(request, response))
              .catch(() => null);
            event?.waitUntil?.(refresh.then(() => undefined));
            return cached || (await refresh) || Response.error();
          }

          self.addEventListener('install', event => {
            event.waitUntil((async () => {
              let candidate = null;
              try {
                candidate = await candidateCacheName();
                const active = await readMeta(ACTIVE_META_KEY);
                if (candidate !== active) {
                  const cache = await caches.open(candidate);
                  await cache.addAll(CORE_SHELL);
                  const optionalResults = await Promise.allSettled(OPTIONAL_ASSETS.map(resource => cache.add(resource)));
                  const failed = optionalResults.filter(result => result.status === 'rejected').length;
                  if (failed) console.warn(`[pwa] ${failed} opcionális erőforrás előtöltése kimaradt.`);
                }
                await writeMeta(PENDING_META_KEY, candidate);
                await self.skipWaiting();
              } catch (error) {
                const active = await readMeta(ACTIVE_META_KEY).catch(() => null);
                if (candidate && candidate !== active) await caches.delete(candidate).catch(() => false);
                await clearMeta(PENDING_META_KEY).catch(() => false);
                console.error('[pwa] A kötelező offline mag nem telepíthető; a korábbi verzió marad aktív.', error);
                throw error;
              }
            })());
          });

          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const pending = await readMeta(PENDING_META_KEY);
              const keys = await caches.keys();
              if (!pending || !keys.includes(pending)) {
                throw new Error('Az új PWA-cache nem aktiválható: hiányzik a teljes, ellenőrzött build-cache.');
              }
              await writeMeta(ACTIVE_META_KEY, pending);
              currentCacheName = pending;
              const cleanup = await Promise.allSettled(keys
                .filter(name => managedCache(name) && name !== pending)
                .map(name => caches.delete(name)));
              const failedDeletes = cleanup.filter(result => result.status === 'rejected').length;
              if (failedDeletes) console.warn(`[pwa] ${failedDeletes} régi cache törlése későbbre maradt.`);
              await clearMeta(PENDING_META_KEY);
              await self.clients.claim();
            })());
          });

          self.addEventListener('fetch', event => {
            const request = event.request;
            if (request.method !== 'GET') return;
            const url = new URL(request.url);
            if (url.origin !== self.location.origin) return;
            if (request.mode === 'navigate') {
              event.respondWith((async () => {
                const response = await networkFirst(request);
                if (response.ok) return response;
                return (await matchActive(request)) || (await matchActive('./index.html')) || response;
              })());
              return;
            }
            const freshCodeOrData = /\.(?:js|css|json|html|webmanifest)$/i.test(url.pathname);
            event.respondWith(freshCodeOrData ? networkFirst(request) : cacheFirstWithRefresh(request, event));
          });
          EOF

          cat > scripts/audit-pwa-shell.mjs <<'EOF'
          /** Audit the service-worker shell against real startup dependencies and files. */
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const read = relative => fs.readFileSync(path.join(ROOT, relative), 'utf8');
          const sw = read('sw.js');
          const errors = [];
          const warnings = [];

          const extractArray = name => {
            const marker = `const ${name} = Object.freeze([`;
            const start = sw.indexOf(marker);
            const end = sw.indexOf(']);', start);
            if (start < 0 || end < 0) throw new Error(`Hiányzó PWA-lista: ${name}`);
            return [...sw.slice(start + marker.length, end).matchAll(/'([^']+)'/g)].map(match => match[1]);
          };

          const core = extractArray('CORE_SHELL');
          const optional = extractArray('OPTIONAL_ASSETS');
          const combined = [...core, ...optional];
          const duplicates = combined.filter((value, index) => combined.indexOf(value) !== index);
          if (duplicates.length) errors.push(`Duplikált PWA útvonalak: ${[...new Set(duplicates)].join(', ')}`);

          const validatePath = (entry, required) => {
            if (!entry.startsWith('./')) errors.push(`Nem relatív PWA útvonal: ${entry}`);
            const relative = entry.replace(/^\.\//, '');
            const resolved = path.resolve(ROOT, relative);
            if (resolved !== ROOT && !resolved.startsWith(`${ROOT}${path.sep}`)) errors.push(`A repositoryn kívülre mutató PWA útvonal: ${entry}`);
            if (!fs.existsSync(resolved)) (required ? errors : warnings).push(`${required ? 'Hiányzó CORE' : 'Hiányzó opcionális'} fájl: ${entry}`);
          };
          core.forEach(entry => validatePath(entry, true));
          optional.forEach(entry => validatePath(entry, false));

          if (combined.filter(entry => entry === './js/focus-experience.js').length !== 1) {
            errors.push('A focus-experience.js pontosan egyszer szerepelhet a PWA-listákban.');
          }
          if (/fociskartyak-2026-v\d+/i.test(sw)) errors.push('Kézzel növelt vNN cache-verzió maradt a service workerben.');
          if (!/cache\.addAll\(CORE_SHELL\)/.test(sw)) errors.push('A CORE_SHELL nem atomikus cache.addAll() művelettel települ.');
          if (!/Promise\.allSettled\(OPTIONAL_ASSETS\.map/.test(sw)) errors.push('Az opcionális assetek best-effort előtöltése hiányzik.');
          if (!/SHA-256/.test(sw) || !/CACHE_PREFIX/.test(sw)) errors.push('A determinisztikus build-hash cache-név hiányzik.');

          const coreSet = new Set(core);
          const corePath = relative => `./${relative.replace(/^\.\//, '')}`;
          const requireCore = (relative, reason) => {
            const entry = corePath(relative);
            if (!coreSet.has(entry)) errors.push(`Hiányzó CORE függőség (${reason}): ${entry}`);
          };

          const index = read('index.html');
          for (const match of index.matchAll(/<(?:script|link)\b[^>]*(?:src|href)="([^"]+)"[^>]*>/g)) {
            const value = match[1];
            if (/^(?:https?:|data:|#)/i.test(value)) continue;
            requireCore(value, 'index.html');
          }

          const manifest = JSON.parse(read('manifest.webmanifest'));
          for (const icon of manifest.icons ?? []) requireCore(icon.src, 'manifest ikon');

          const registry = JSON.parse(read('data/databases/registry.json'));
          const entry = registry.databases?.find(item => item.id === registry.defaultDatabaseId && item.enabled !== false);
          if (!entry?.manifest) errors.push('Az aktív adatbázis manifestje nem oldható fel.');
          else {
            requireCore(entry.manifest, 'aktív adatbázis manifest');
            const databaseManifest = JSON.parse(read(entry.manifest));
            const normalized = databaseManifest.files?.normalizedPlayers;
            if (!normalized) errors.push('Az aktív adatbázis normalizált játékosfájlja hiányzik a manifestből.');
            else requireCore(normalized, 'aktív normalizált játékosadatbázis');
          }

          const discovered = new Set();
          const queue = [...index.matchAll(/<script\b[^>]*src="([^"]+\.js)"[^>]*>/g)].map(match => match[1]);
          const importPatterns = [
            /(?:import|export)\s+(?:[^'";]*?\sfrom\s*)?['"]([^'"]+)['"]/g,
            /import\(\s*['"]([^'"]+)['"]\s*\)/g,
          ];
          while (queue.length) {
            const relative = path.posix.normalize(queue.shift().replace(/^\.\//, ''));
            if (discovered.has(relative) || !relative.endsWith('.js')) continue;
            discovered.add(relative);
            const absolute = path.join(ROOT, relative);
            if (!fs.existsSync(absolute)) continue;
            const source = fs.readFileSync(absolute, 'utf8');
            for (const pattern of importPatterns) {
              pattern.lastIndex = 0;
              for (const match of source.matchAll(pattern)) {
                const specifier = match[1];
                if (!specifier.startsWith('.')) continue;
                const resolved = path.posix.normalize(path.posix.join(path.posix.dirname(relative), specifier));
                if (resolved.endsWith('.js')) queue.push(resolved);
              }
            }
          }
          for (const module of discovered) requireCore(module, 'JavaScript importgráf');

          const pipeline = read('js/ui/ui-enhancement-pipeline.js');
          for (const match of pipeline.matchAll(/['"](\.\.\/[^'"]+\.js)['"]/g)) {
            const resolved = path.posix.normalize(path.posix.join('js/ui', match[1]));
            requireCore(resolved, 'UI enhancement pipeline');
          }

          if (warnings.length) console.warn(`[pwa-audit] ${warnings.length} figyelmeztetés:\n- ${warnings.join('\n- ')}`);
          if (errors.length) {
            console.error(`[pwa-audit] ${errors.length} hiba:\n- ${errors.join('\n- ')}`);
            process.exitCode = 1;
          } else {
            console.log(`✓ PWA shell audit: ${core.length} CORE + ${optional.length} opcionális erőforrás, duplikáció és hiányzó indulási függőség nélkül`);
          }
          EOF

          cat > test/pwa-cache.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { webcrypto } from 'node:crypto';
          import { TextEncoder } from 'node:util';

          const swSource = fs.readFileSync(new URL('../sw.js', import.meta.url), 'utf8');
          const extractArray = name => {
            const marker = `const ${name} = Object.freeze([`;
            const start = swSource.indexOf(marker);
            const end = swSource.indexOf(']);', start);
            return [...swSource.slice(start + marker.length, end).matchAll(/'([^']+)'/g)].map(match => match[1]);
          };
          const CORE = extractArray('CORE_SHELL');
          const OPTIONAL = extractArray('OPTIONAL_ASSETS');
          assert.ok(CORE.length > 0);
          assert.ok(OPTIONAL.length > 0);

          class FakeCache {
            constructor(environment, name) { this.environment = environment; this.name = name; this.entries = new Map(); }
            key(request) { return new URL(typeof request === 'string' ? request : request.url, this.environment.origin).href; }
            async addAll(resources) {
              if (resources.some(resource => this.environment.failCore.has(resource))) throw new Error('core fetch failed');
              resources.forEach(resource => this.entries.set(this.key(resource), new Response(`cached:${resource}`)));
            }
            async add(resource) {
              if (this.environment.failOptional.has(resource)) throw new Error('optional fetch failed');
              this.entries.set(this.key(resource), new Response(`cached:${resource}`));
            }
            async put(request, response) { this.entries.set(this.key(request), response.clone()); }
            async match(request) { return this.entries.get(this.key(request))?.clone() ?? undefined; }
            async delete(request) { return this.entries.delete(this.key(request)); }
          }

          function createEnvironment({ failCore = [], failOptional = [], scriptSource = swSource } = {}) {
            const origin = 'https://example.test/';
            const listeners = {};
            const cachesByName = new Map();
            const env = {
              origin,
              failCore: new Set(failCore),
              failOptional: new Set(failOptional),
              scriptSource,
              offline: false,
              skipWaitingCalls: 0,
              claimCalls: 0,
            };
            const cacheStorage = {
              async open(name) {
                if (!cachesByName.has(name)) cachesByName.set(name, new FakeCache(env, name));
                return cachesByName.get(name);
              },
              async keys() { return [...cachesByName.keys()]; },
              async delete(name) { return cachesByName.delete(name); },
            };
            const self = {
              location: { href: `${origin}sw.js`, origin },
              clients: { claim: async () => { env.claimCalls += 1; } },
              skipWaiting: async () => { env.skipWaitingCalls += 1; },
              addEventListener: (type, handler) => { listeners[type] = handler; },
            };
            const fetchFn = async request => {
              const url = typeof request === 'string' ? request : request.url;
              if (url === self.location.href) return new Response(env.scriptSource, { status: 200 });
              if (env.offline) throw new Error('offline');
              return new Response(`network:${url}`, { status: 200 });
            };
            vm.runInNewContext(swSource, {
              self, caches: cacheStorage, fetch: fetchFn, Request, Response, URL, TextEncoder,
              Uint8Array, crypto: webcrypto, console, Promise, Error, JSON, String, Object,
            }, { filename: 'sw.js' });
            const eventPromise = handler => {
              let promise;
              handler({ waitUntil: value => { promise = Promise.resolve(value); } });
              return promise;
            };
            const triggerFetch = request => {
              let responsePromise;
              let waitPromise = Promise.resolve();
              listeners.fetch({
                request,
                respondWith: value => { responsePromise = Promise.resolve(value); },
                waitUntil: value => { waitPromise = Promise.resolve(value); },
              });
              return { response: responsePromise, background: waitPromise };
            };
            return { env, listeners, cachesByName, cacheStorage, install: () => eventPromise(listeners.install), activate: () => eventPromise(listeners.activate), triggerFetch };
          }

          const legacyName = 'fociskartyak-2026-v84';
          const successful = createEnvironment();
          await successful.cacheStorage.open(legacyName);
          await successful.install();
          assert.equal(successful.env.skipWaitingCalls, 1);
          let names = await successful.cacheStorage.keys();
          const candidate = names.find(name => name.startsWith('fociskartyak-2026-build-'));
          assert.ok(candidate, 'sikeres install után létre kell jönnie a build-cache-nek');
          assert.ok(names.includes(legacyName), 'aktiválás előtt a régi működő cache megmarad');
          await successful.activate();
          names = await successful.cacheStorage.keys();
          assert.ok(names.includes(candidate));
          assert.equal(names.includes(legacyName), false, 'sikeres aktiválás után a régi cache törlődik');
          assert.equal(successful.env.claimCalls, 1);

          successful.env.offline = true;
          const navigation = successful.triggerFetch({ method: 'GET', mode: 'navigate', url: `${successful.env.origin}deep/link` });
          assert.equal(await (await navigation.response).text(), 'cached:./index.html');

          const optionalFailure = createEnvironment({ failOptional: [OPTIONAL[0]] });
          await optionalFailure.install();
          assert.equal(optionalFailure.env.skipWaitingCalls, 1, 'opcionális asset hibája nem blokkolhatja az installt');

          const coreFailure = createEnvironment({ failCore: [CORE[0]] });
          await coreFailure.cacheStorage.open(legacyName);
          await assert.rejects(coreFailure.install(), /core fetch failed/);
          assert.equal(coreFailure.env.skipWaitingCalls, 0, 'hibás CORE után tilos a skipWaiting');
          const failedNames = await coreFailure.cacheStorage.keys();
          assert.ok(failedNames.includes(legacyName), 'CORE hiba után a régi cache megmarad');
          assert.equal(failedNames.some(name => name.startsWith('fociskartyak-2026-build-')), false, 'félkész build-cache nem maradhat hátra');

          const deterministicA = createEnvironment();
          await deterministicA.install();
          const nameA = (await deterministicA.cacheStorage.keys()).find(name => name.startsWith('fociskartyak-2026-build-'));
          const deterministicB = createEnvironment();
