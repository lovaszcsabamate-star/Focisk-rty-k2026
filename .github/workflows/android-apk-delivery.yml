name: Letölthető Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk-delivery.yml'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/mobile-runtime-smoke.mjs'
      - 'scripts/build-standalone-with-settings.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk-delivery.yml'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/mobile-runtime-smoke.mjs'
      - 'scripts/build-standalone.mjs'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'scripts/runtime-browser-smoke.mjs'
      - 'index.html'
      - 'js/**'
      - 'css/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js 22 beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 beállítása
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK beállítása
        uses: android-actions/setup-android@v3

      - name: Android 16 SDK telepítése
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Függőségek telepítése
        run: npm ci

      - name: Forrás és Gyors meccs ellenőrzése
        run: |
          npm run lint
          node --check scripts/apply-android-icon.mjs
          node --check scripts/mobile-runtime-smoke.mjs
          node test/deck-selection-menu-component.test.mjs

      - name: Offline mobil webcsomag készítése
        run: npm run mobile:prepare

      - name: Android WebView csomag statikus ellenőrzése
        run: |
          test -s mobile-www/index.html
          grep -q 'mobile-webview-compatible' mobile-www/index.html
          grep -q '(async () => {' mobile-www/index.html
          ! grep -Fq 'type="module"' mobile-www/index.html
          ! grep -Fq "type='module'" mobile-www/index.html
          ! grep -Eq '<script[^>]+src=' mobile-www/index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('mobile-www/index.html','utf8');if(s.indexOf('beginUiEnhancementLayer(')<s.indexOf('/* ===== js/ui.js ===== */'))process.exit(1)"

      - name: Android APK valódi futásidejű ellenőrzése
        id: mobile_runtime
        continue-on-error: true
        run: node scripts/mobile-runtime-smoke.mjs

      - name: Mobil futásidejű diagnosztika mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-runtime-report
          path: runtime-browser-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Futásidejű hiba megállítja az APK buildet
        if: steps.mobile_runtime.outcome == 'failure'
        run: |
          cat runtime-browser-report.json || true
          exit 1

      - name: Android projekt létrehozása és szinkronizálása
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icon.mjs

      - name: Álló tájolás beállítása
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android:screenOrientation=' not in text:
              text = text.replace(
                  'android:configChanges=',
                  'android:screenOrientation="portrait"\n            android:configChanges=',
                  1,
              )
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: APK összeállítása
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Letölthető fájl előkészítése
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Fociskartyak2026-Android-audited.apk
          sha256sum dist/Fociskartyak2026-Android-audited.apk > dist/Fociskartyak2026-Android-audited.sha256

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: Fociskartyak2026-Android-audited
          path: |
            dist/Fociskartyak2026-Android-audited.apk
            dist/Fociskartyak2026-Android-audited.sha256
          if-no-files-found: error
          retention-days: 30
