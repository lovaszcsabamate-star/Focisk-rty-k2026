name: Beta Stabilization 1.2 release gate

on:
  push:
    branches:
      - fix/beta-stabilization-1-2-match-polish
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-pwa-mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency high-severity gate
        run: npm audit --omit=dev --audit-level=high
      - name: Release metadata and clean diff
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          node -e "const p=require('./package.json'); console.log('version='+p.version)"
          git diff --check origin/main...HEAD
      - name: Syntax and full project regression
        run: |
          npm run lint
          node --check js/match-experience-polish.js
          node --check test/match-experience-polish.test.mjs
          npm test
          npm run test:all
      - name: Session recovery and liveness regressions
        run: |
          node test/session-recovery.test.mjs
          node test/round-operation-liveness.test.mjs
          node test/tournament-match-liveness.test.mjs
          node test/session-lifecycle-service.test.mjs
          node test/storage-service.test.mjs
          node test/save-service.test.mjs
          node test/tournament-launch-transaction.test.mjs
      - name: Match Experience, tournament, lineup and Quick Match regressions
        run: |
          node test/match-experience-polish.test.mjs
          node test/player-heights.test.mjs
          node test/tournament-mode.test.mjs
          node test/tournament-statistics.test.mjs
          node test/tournament-lineup-state.test.mjs
          node test/tournament-lineup-ui.test.mjs
          node test/tournament-lineup-matchday.test.mjs
          node test/deck-selection.test.mjs
          node test/deck-selection-menu-component.test.mjs
          node test/result-controller.test.mjs
      - name: Accessibility and PWA offline integrity
        run: |
          npm run test:accessibility
          npm run audit:pwa
          npm run test:pwa-cache
      - name: Production and standalone build
        run: |
          npm run build
          npm run build:standalone
          npm run test:standalone-game-runtime
      - name: Browser and mobile runtime smoke
        run: |
          npm run test:runtime
          npm run mobile:prepare
          npm run test:mobile-layout
          npm run test:runtime
      - name: Standalone artifact sanity
        run: |
          test -s Fociskartyak2026.html
          grep -q "Magasabb játékos" Fociskartyak2026.html
          grep -q "Játék helyreállítása" Fociskartyak2026.html
          grep -q "match-experience-hud" Fociskartyak2026.html
          grep -q "MÉRKŐZÉS INDÍTÁSA" Fociskartyak2026.html

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Prepare and sync Capacitor Android
        run: |
          npm run mobile:prepare
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Android WebView asset smoke
        run: |
          WEBVIEW=android/app/src/main/assets/public/index.html
          test -s "$WEBVIEW"
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('android/app/src/main/assets/public/index.html').read_text(encoding='utf-8')
          for marker in ('Magasabb játékos', 'Játék helyreállítása', 'match-experience-hud', 'MÉRKŐZÉS INDÍTÁSA', 'android-startup'):
              if marker not in html:
                  raise SystemExit(f'Hiányzó Android WebView marker: {marker}')
          if re.search(r'<script\b[^>]*\bsrc=', html, re.IGNORECASE):
              raise SystemExit('Külső script src maradt az Android standalone bundle-ben.')
          if re.search(r'<script\b[^>]*\btype=["\']module["\']', html, re.IGNORECASE):
              raise SystemExit('Module script maradt az Android standalone bundle-ben.')
          print('Android WebView standalone asset smoke: OK')
          PY
      - name: Gradle debug checks and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug
      - name: APK SHA-256
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          sha256sum "$APK" | tee Fociskartyak2026-Beta-Stabilization-1.2-debug-apk.sha256
          cp "$APK" Fociskartyak2026-Beta-Stabilization-1.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fociskartyak2026-Beta-Stabilization-1.2-debug-apk
          path: |
            Fociskartyak2026-Beta-Stabilization-1.2-debug.apk
            Fociskartyak2026-Beta-Stabilization-1.2-debug-apk.sha256
          if-no-files-found: error
          retention-days: 14
