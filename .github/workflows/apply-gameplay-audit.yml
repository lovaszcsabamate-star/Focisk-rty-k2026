name: Apply gameplay audit fixes

on:
  push:
    branches:
      - fix/gameplay-audit-2026-07-30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited gameplay changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Persistent 90-second choice-time setting.
          replace_once(
              'js/app/configuration.js',
              "  simplified: 'fociskartyak:simplified',\n});",
              "  simplified: 'fociskartyak:simplified',\n  timedTurns: 'fociskartyak:timedTurns',\n});",
          )
          replace_once(
              'js/app/configuration.js',
              "  simplified: false,\n});",
              "  simplified: false,\n  timedTurns: false,\n});",
          )

          # A draw is shown with a football as requested, while the semantic class/title stays a draw.
          replace_once(
              'js/ui/scoreboard-component.js',
              "    const symbol = outcome === 'win' ? '⚽' : outcome === 'loss' ? '✕' : outcome === 'tie' ? '—' : '○';",
              "    const symbol = outcome === 'win' || outcome === 'tie' ? '⚽' : outcome === 'loss' ? '✕' : '○';",
          )

          # Tournament results are only accepted when returning to the tournament centre.
          # Until then the same match and the same selected lineup can be replayed.
          replace_once(
              'js/tournament-mode.js',
              """const simulateAndSave = state => {
  let next = simulatePendingAiMatches(advanceTournament(state), strengthResolver(state));
  next = advanceTournament(next);
  tournamentStorageService.save(next);
  if (next.status === TOURNAMENT_STATUS.COMPLETE) tournamentStorageService.archive(next);
  return next;
};""",
              """const simulateState = state => {
  let next = simulatePendingAiMatches(advanceTournament(state), strengthResolver(state));
  return advanceTournament(next);
};
const persistTournamentState = state => {
  tournamentStorageService.save(state);
  if (state.status === TOURNAMENT_STATUS.COMPLETE) tournamentStorageService.archive(state);
  return state;
};
const simulateAndSave = state => persistTournamentState(simulateState(state));""",
          )
          replace_once(
              'js/tournament-mode.js',
              "    next = simulateAndSave(next);",
              "    next = simulateState(next);",
          )
          replace_once(
              'js/tournament-mode.js',
              """  const originalHome = node.querySelector('#menu-btn');
  const humanHome = current.homeId === stored.humanTeamId;""",
              """  const humanHome = current.homeId === stored.humanTeamId;""",
          )
          replace_once(
              'js/tournament-mode.js',
              """  const actions = node.querySelector('.result-actions');
  if (actions) {
    actions.replaceChildren();
    const continueButton = document.createElement('button');
    continueButton.className = 'btn';
    continueButton.textContent = next.status === TOURNAMENT_STATUS.COMPLETE ? '🏆 Torna végeredménye' : '🏆 Torna folytatása';
    continueButton.addEventListener('click', () => showTournamentCenter(next, null), { once: true });
    const homeButton = document.createElement('button');
    homeButton.className = 'btn btn--ghost';
    homeButton.textContent = 'Főmenü';
    homeButton.addEventListener('click', () => {
      if (originalHome) originalHome.click();
      else navigateHome();
    }, { once: true });
    actions.append(continueButton, homeButton);
  }
  const context = document.createElement('p');
  context.className = 'tournament-result-context';
  context.textContent = `${next.name} · ${phaseLabel(next)} · eredmény elmentve`;""",
              """  const actions = node.querySelector('.result-actions');
  if (actions) {
    actions.replaceChildren();
    const replayButton = document.createElement('button');
    replayButton.className = 'btn btn--ghost';
    replayButton.textContent = '↻ Meccs újrajátszása';
    replayButton.disabled = !Array.isArray(stored.currentLineupIds) || stored.currentLineupIds.length < 4;
    replayButton.addEventListener('click', () => {
      tournamentStorageService.save(stored);
      launchTournamentMatch(stored, current, [...stored.currentLineupIds]);
    }, { once: true });
    const tournamentHomeButton = document.createElement('button');
    tournamentHomeButton.className = 'btn';
    tournamentHomeButton.textContent = next.status === TOURNAMENT_STATUS.COMPLETE
      ? '🏆 Torna végeredménye'
      : '🏆 Torna kezdőlapja';
    tournamentHomeButton.addEventListener('click', () => showTournamentCenter(next, null), { once: true });
    actions.append(replayButton, tournamentHomeButton);
  }
  const context = document.createElement('p');
  context.className = 'tournament-result-context';
  context.textContent = `${next.name} · ${phaseLabel(next)} · az eredmény elfogadásra vár`;""",
          )

          Path('js/matchday.js').write_text(r'''/** Football-broadcast scoreboard, kickoff and optional timed turns. */

import { UI, el } from './ui.js';
import { AI, HUMAN, PHASE } from './engine.js';
import { hasAttributeData } from './data/players.js';
import { saveBooleanSetting } from './mobile-experience.js';

export const CHOICE_LIMIT_SECONDS = 90;
export const KICKOFF_STEP_MS = 650;

const matchdayPrevious = Object.freeze({
  classicScores: UI.prototype._renderClassicScores,
  penaltyScores: UI.prototype._renderPenaltyScores,
  resetTable: UI.prototype.resetTable,
  renderScores: UI.prototype.renderScores,
  showAttributePicker: UI.prototype.showAttributePicker,
  hideAttributePicker: UI.prototype.hideAttributePicker,
  renderHands: UI.prototype.renderHands,
  showDuel: UI.prototype.showDuel,
  showVerdict: UI.prototype.showVerdict,
  showOverlay: UI.prototype.showOverlay,
});

const matchdayStates = new WeakMap();
const matchdaySideLabel = side => side === HUMAN ? 'Játékos' : 'Gép';
const matchdayOtherSide = side => side === HUMAN ? AI : HUMAN;
const matchdayTeamLabel = (game, side) => {
  const quickMatchLabel = side === HUMAN ? game?.quickMatch?.humanTeam : game?.quickMatch?.aiTeam;
  return String(quickMatchLabel ?? matchdaySideLabel(side)).trim() || matchdaySideLabel(side);
};
const matchdayFormatClock = totalSeconds => {
  const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  return `${String(Math.floor(safe / 60)).padStart(2, '0')}:${String(safe % 60).padStart(2, '0')}`;
};
const matchdayNow = () => Date.now();

function matchdayState(ui) {
  let state = matchdayStates.get(ui);
  if (state) return state;
  state = {
    kickoffPending: true,
    kickoffRunning: false,
    pendingChoiceKind: null,
    lastGame: null,
    lastSelectable: false,
    matchStartedAt: 0,
    matchPausedAt: 0,
    matchElapsedMs: 0,
    matchTimer: 0,
    choiceDeadline: 0,
    choicePausedAt: 0,
    choiceTimer: 0,
    choiceKind: null,
  };
  matchdayStates.set(ui, state);
  return state;
}

function matchdayScoreboardStatus(game) {
  if (game.phase === PHASE.GAME_OVER) return 'VÉGEREDMÉNY';
  if (game.phase === PHASE.REVEAL) return `KÖVETKEZŐ VÁLASZTÓ: ${matchdaySideLabel(matchdayOtherSide(game.chooser)).toUpperCase()}`;
  return `KATEGÓRIÁT VÁLASZT: ${matchdaySideLabel(game.chooser).toUpperCase()}`;
}

function matchdayOverlayOpen(ui) {
  return ui.dom?.overlay?.hidden === false || document.visibilityState === 'hidden';
}

function matchdayUpdateClockNodes(ui) {
  const state = matchdayState(ui);
  const elapsed = matchdayFormatClock(state.matchElapsedMs / 1000);
  document.querySelectorAll('[data-match-clock]').forEach(node => { node.textContent = elapsed; });
  const remaining = state.choiceDeadline
    ? Math.max(0, Math.ceil((state.choiceDeadline - matchdayNow()) / 1000))
    : CHOICE_LIMIT_SECONDS;
  document.querySelectorAll('[data-choice-clock]').forEach(node => {
    node.textContent = ui.settings?.timedTurns ? matchdayFormatClock(remaining) : 'NINCS LIMIT';
    node.classList.toggle('is-urgent', Boolean(ui.settings?.timedTurns && state.choiceDeadline && remaining <= 10));
  });
}

function matchdayPauseAwareDeadline(state, now, paused) {
  if (paused) {
    if (!state.choicePausedAt) state.choicePausedAt = now;
    return;
  }
  if (state.choicePausedAt) {
    state.choiceDeadline += now - state.choicePausedAt;
    state.choicePausedAt = 0;
  }
}

function matchdayStopChoiceTimer(ui, { keepPending = false } = {}) {
  const state = matchdayState(ui);
  if (state.choiceTimer) globalThis.clearInterval?.(state.choiceTimer);
  state.choiceTimer = 0;
  state.choiceDeadline = 0;
  state.choicePausedAt = 0;
  state.choiceKind = null;
  if (!keepPending) state.pendingChoiceKind = null;
  matchdayUpdateClockNodes(ui);
}

function matchdayAutomaticChoice(ui, kind) {
  const game = matchdayState(ui).lastGame;
  if (!game) return false;
  if (kind === 'attribute') {
    const key = game.availableAttributeKeys?.()[0];
    if (!key) return false;
    ui.showToast?.('Lejárt a 90 másodperc – automatikus kategóriaválasztás.', 'info', 2600);
    ui.handlers?.onAttribute?.(key);
    return true;
  }
  const attribute = game.attribute;
  const cards = Array.isArray(game.hands?.[HUMAN]) ? game.hands[HUMAN] : [];
  const card = cards.find(item => !attribute || hasAttributeData(item, attribute));
  if (!card) return false;
  ui.showToast?.('Lejárt a 90 másodperc – automatikus kártyaválasztás.', 'info', 2600);
  ui.handlers?.onCard?.(card);
  return true;
}

function matchdayStartChoiceTimer(ui, kind, game = null) {
  const state = matchdayState(ui);
  if (game) state.lastGame = game;
  state.pendingChoiceKind = kind;
  if (!ui.settings?.timedTurns) {
    matchdayStopChoiceTimer(ui, { keepPending: true });
    return false;
  }
  if (state.kickoffRunning || state.kickoffPending) {
    matchdayUpdateClockNodes(ui);
    return true;
  }
  matchdayStopChoiceTimer(ui, { keepPending: true });
  state.choiceKind = kind;
  state.choiceDeadline = matchdayNow() + CHOICE_LIMIT_SECONDS * 1000;
  state.choiceTimer = globalThis.setInterval?.(() => {
    const now = matchdayNow();
    matchdayPauseAwareDeadline(state, now, matchdayOverlayOpen(ui));
    if (matchdayOverlayOpen(ui)) return;
    matchdayUpdateClockNodes(ui);
    if (now < state.choiceDeadline) return;
    const expiredKind = state.choiceKind;
    matchdayStopChoiceTimer(ui);
    matchdayAutomaticChoice(ui, expiredKind);
  }, 250) ?? 0;
  matchdayUpdateClockNodes(ui);
  return true;
}

function matchdayStopMatchClock(ui, { reset = false } = {}) {
  const state = matchdayState(ui);
  if (state.matchTimer) globalThis.clearInterval?.(state.matchTimer);
  state.matchTimer = 0;
  state.matchPausedAt = 0;
  if (reset) {
    state.matchStartedAt = 0;
    state.matchElapsedMs = 0;
  }
  matchdayUpdateClockNodes(ui);
}

function matchdayStartMatchClock(ui) {
  const state = matchdayState(ui);
  matchdayStopMatchClock(ui, { reset: true });
  state.matchStartedAt = matchdayNow();
  state.matchTimer = globalThis.setInterval?.(() => {
    const now = matchdayNow();
    const paused = matchdayOverlayOpen(ui);
    if (paused) {
      if (!state.matchPausedAt) state.matchPausedAt = now;
      return;
    }
    if (state.matchPausedAt) {
      state.matchStartedAt += now - state.matchPausedAt;
      state.matchPausedAt = 0;
    }
    state.matchElapsedMs = Math.max(0, now - state.matchStartedAt);
    matchdayUpdateClockNodes(ui);
  }, 250) ?? 0;
  matchdayUpdateClockNodes(ui);
}

function matchdayPlayWhistle(ui) {
  if (!ui.settings?.sounds) return;
  try {
    const AudioContextCtor = globalThis.AudioContext ?? globalThis.webkitAudioContext;
    if (!AudioContextCtor) return;
    const context = new AudioContextCtor();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(1850, context.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(2450, context.currentTime + .22);
    gain.gain.setValueAtTime(.0001, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(.18, context.currentTime + .025);
    gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .38);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();
    oscillator.stop(context.currentTime + .4);
    oscillator.addEventListener('ended', () => context.close?.(), { once: true });
  } catch {
    // A hangkimenet tiltása nem akadályozhatja a mérkőzés indulását.
  }
}

function matchdayBeginKickoff(ui) {
  const state = matchdayState(ui);
  if (!state.kickoffPending || state.kickoffRunning) return;
  state.kickoffPending = false;
  state.kickoffRunning = true;
  matchdayStopChoiceTimer(ui, { keepPending: true });
  document.querySelector('#matchday-kickoff')?.remove();
  const layer = el('div', 'matchday-kickoff');
  layer.id = 'matchday-kickoff';
  layer.setAttribute('role', 'status');
  layer.setAttribute('aria-live', 'assertive');
  document.body.appendChild(layer);
  ui.dom?.pub?.classList.add('matchday-kickoff-active');
  const steps = ['3', '2', '1', '📣 SÍP!'];
  let index = 0;
  const advance = () => {
    layer.textContent = steps[index];
    layer.dataset.step = String(index);
    if (index === steps.length - 1) {
      matchdayPlayWhistle(ui);
      matchdayStartMatchClock(ui);
      globalThis.setTimeout?.(() => {
        layer.remove();
        ui.dom?.pub?.classList.remove('matchday-kickoff-active');
        state.kickoffRunning = false;
        if (state.pendingChoiceKind) matchdayStartChoiceTimer(ui, state.pendingChoiceKind, state.lastGame);
      }, 520);
      return;
    }
    index += 1;
    globalThis.setTimeout?.(advance, KICKOFF_STEP_MS);
  };
  advance();
}

function matchdayInjectTimedSetting(ui, root) {
  const list = root?.querySelector?.('.settings-list');
  if (list && !list.querySelector('[data-setting="timedTurns"]')) {
    const row = el('label', 'setting-switch');
    row.dataset.setting = 'timedTurns';
    const copy = el('span', 'setting-switch__copy');
    copy.append(el('strong', null, '⏱ 90 mp-es választási idő'), el('small', null, 'Kategória- és kártyaválasztásonként 90 másodperc'));
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(ui.settings?.timedTurns);
    input.setAttribute('aria-label', '90 másodperces választási idő');
    input.addEventListener('change', () => {
      ui.settings.timedTurns = input.checked;
      saveBooleanSetting('timedTurns', input.checked);
      if (!input.checked) matchdayStopChoiceTimer(ui);
      else {
        const state = matchdayState(ui);
        const kind = ui.dom?.picker?.querySelector('button[data-attribute], .attr-btn, .category-tile')
          ? 'attribute'
          : state.lastSelectable ? 'card' : null;
        if (kind) matchdayStartChoiceTimer(ui, kind, state.lastGame);
      }
      matchdayUpdateClockNodes(ui);
    });
    row.append(copy, input, el('span', 'setting-switch__visual'));
    list.appendChild(row);
  }

  const menu = root?.classList?.contains('menu-panel') ? root : root?.querySelector?.('.menu-panel');
  if (menu && !menu.querySelector('[data-timed-mode-toggle]')) {
    const label = el('label', 'timed-mode-toggle');
    label.dataset.timedModeToggle = 'true';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(ui.settings?.timedTurns);
    input.addEventListener('change', () => {
      ui.settings.timedTurns = input.checked;
      saveBooleanSetting('timedTurns', input.checked);
    });
    label.append(input, el('span', null, '⏱ 90 mp választási idő'));
    menu.querySelector('.primary-mode-actions')?.after(label);
  }
}

function matchdayDecorateFinalScore(ui, root) {
  const final = root?.querySelector?.('.final-score');
  if (!final || final.dataset.sportsScoreboard === 'true') return;
  const match = final.textContent?.match(/JÁTÉKOS\s+(\d+)\s*[–-]\s*(\d+)\s+GÉP/i);
  if (!match) return;
  const state = matchdayState(ui);
  const elapsed = matchdayFormatClock(state.matchElapsedMs / 1000);
  final.dataset.sportsScoreboard = 'true';
  const home = el('span', 'final-score__team', 'JÁTÉKOS ');
  const score = el('strong', 'final-score__numbers', `${match[1]}–${match[2]}`);
  const away = el('span', 'final-score__team', ' GÉP');
  const time = el('small', 'final-score__time', ` · IDŐ ${elapsed}`);
  final.replaceChildren(home, score, away, time);
  const heading = root.querySelector('h1')?.textContent?.trim().toLocaleUpperCase('hu-HU');
  if (heading === 'DÖNTETLEN') {
    root.classList.remove('result-panel--loss');
    root.classList.add('result-panel--tie');
  }
}

UI.prototype._renderMatchScoreboard = function renderMatchScoreboard(game, human, ai) {
  const board = el('div', `match-scoreboard${game.mode === 'penalties' ? ' match-scoreboard--penalties' : ''}`);
  const status = matchdayScoreboardStatus(game);
  const humanLabel = matchdayTeamLabel(game, HUMAN);
  const aiLabel = matchdayTeamLabel(game, AI);
  board.setAttribute('role', 'status');
  board.setAttribute('aria-live', 'polite');
  board.setAttribute('aria-label', `${humanLabel} ${human}, ${aiLabel} ${ai}. ${status.toLowerCase()}.`);

  const competition = el('div', 'match-scoreboard__competition', game.mode === 'penalties' ? 'BÜNTETŐPÁRBAJ' : 'KÁRTYAMECCS');
  const clock = el('div', 'match-scoreboard__clock');
  clock.append(el('span', null, 'IDŐ'), el('strong', null, '00:00'));
  clock.querySelector('strong').dataset.matchClock = 'true';
  const home = el('div', 'match-team match-team--home');
  home.append(el('span', 'match-team__crest', '⚽'), el('span', 'match-team__name', humanLabel.toUpperCase()));
  const score = el('div', 'match-scoreboard__score');
  score.append(
    el('strong', 'match-scoreboard__number', String(human)),
    el('span', 'match-scoreboard__separator', '–'),
    el('strong', 'match-scoreboard__number', String(ai)),
  );
  const away = el('div', 'match-team match-team--away');
  away.append(el('span', 'match-team__name', aiLabel.toUpperCase()), el('span', 'match-team__crest', '🤖'));
  const possession = el('div', 'match-scoreboard__status', status);
  const choice = el('div', 'match-scoreboard__choice');
  choice.append(el('span', null, 'VÁLASZTÁS'), el('strong', null, this.settings?.timedTurns ? '01:30' : 'NINCS LIMIT'));
  choice.querySelector('strong').dataset.choiceClock = 'true';
  board.append(competition, clock, home, score, away, possession, choice);
  return board;
};

UI.prototype._renderClassicScores = function renderClassicMatchScore(game) {
  matchdayPrevious.classicScores?.call(this, game);
  const { [HUMAN]: human, [AI]: ai } = game.scores;
  this.dom.hudScores.replaceChildren(this._renderMatchScoreboard(game, human, ai));
  matchdayUpdateClockNodes(this);
};

UI.prototype._renderPenaltyScores = function renderPenaltyMatchScore(game) {
  matchdayPrevious.penaltyScores?.call(this, game);
  const human = game.scores[HUMAN];
  const ai = game.scores[AI];
  this.dom.hudScores.replaceChildren(this._renderMatchScoreboard(game, human, ai));
  matchdayUpdateClockNodes(this);
};

UI.prototype.resetTable = function resetMatchdayTable(...args) {
  const output = matchdayPrevious.resetTable.apply(this, args);
  const state = matchdayState(this);
  matchdayStopChoiceTimer(this);
  matchdayStopMatchClock(this, { reset: true });
  state.kickoffPending = true;
  state.kickoffRunning = false;
  state.pendingChoiceKind = null;
  state.lastGame = null;
  state.lastSelectable = false;
  document.querySelector('#matchday-kickoff')?.remove();
  this.dom?.pub?.classList.remove('matchday-kickoff-active');
  return output;
};

UI.prototype.renderScores = function renderScoresWithMatchday(game) {
  const output = matchdayPrevious.renderScores.call(this, game);
  const state = matchdayState(this);
  state.lastGame = game;
  matchdayUpdateClockNodes(this);
  if (state.kickoffPending) matchdayBeginKickoff(this);
  return output;
};

UI.prototype.showAttributePicker = function showTimedAttributePicker(game) {
  const output = matchdayPrevious.showAttributePicker.call(this, game);
  const state = matchdayState(this);
  state.lastGame = game;
  state.lastSelectable = false;
  matchdayStartChoiceTimer(this, 'attribute', game);
  return output;
};

UI.prototype.hideAttributePicker = function hideTimedAttributePicker(...args) {
  if (matchdayState(this).choiceKind === 'attribute') matchdayStopChoiceTimer(this);
  return matchdayPrevious.hideAttributePicker.apply(this, args);
};

UI.prototype.renderHands = function renderTimedHands(game, options = {}) {
  const output = matchdayPrevious.renderHands.call(this, game, options);
  const state = matchdayState(this);
  state.lastGame = game;
  state.lastSelectable = Boolean(options.selectable);
  if (options.selectable) matchdayStartChoiceTimer(this, 'card', game);
  else if (state.choiceKind === 'card') matchdayStopChoiceTimer(this);
  return output;
};

UI.prototype.showDuel = function showMatchdayDuel(...args) {
  matchdayStopChoiceTimer(this);
  return matchdayPrevious.showDuel.apply(this, args);
};

UI.prototype.showVerdict = function showMatchdayVerdict(...args) {
  matchdayStopChoiceTimer(this);
  return matchdayPrevious.showVerdict.apply(this, args);
};

UI.prototype.showOverlay = function showMatchdayOverlay(node) {
  const output = matchdayPrevious.showOverlay.call(this, node);
  matchdayInjectTimedSetting(this, node);
  if (node?.classList?.contains('result-panel')) {
    matchdayStopChoiceTimer(this);
    const state = matchdayState(this);
    if (state.matchStartedAt && state.matchTimer) state.matchElapsedMs = Math.max(0, matchdayNow() - state.matchStartedAt);
    matchdayStopMatchClock(this);
    matchdayDecorateFinalScore(this, node);
  }
  return output;
};
''', encoding='utf-8')

          Path('css/matchday.css').write_text(r'''/* Large football broadcast-style scoreboard, clocks and kickoff. */

.score-strip {
  width: min(680px, 100%);
  min-width: 460px;
  justify-content: center;
}

.match-scoreboard {
  width: min(680px, 100%);
  display: grid;
  grid-template-columns: minmax(135px, 1fr) minmax(132px, auto) minmax(135px, 1fr);
  grid-template-areas:
    "competition competition clock"
    "home score away"
    "status status choice";
  align-items: stretch;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,.82);
  border-radius: 9px;
  background: #080b0a;
  color: #fff;
  box-shadow: 0 8px 26px rgba(0,0,0,.58), inset 0 0 0 1px rgba(0,0,0,.84);
  font-variant-numeric: tabular-nums;
}

.match-scoreboard__competition {
  grid-area: competition;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  padding: 4px 12px;
  background: linear-gradient(90deg, #0b552e, #16854b 50%, #0b552e);
  color: #f4fff8;
  font-size: 10px;
  font-weight: 950;
  letter-spacing: 2px;
  text-align: center;
}

.match-scoreboard__clock,
.match-scoreboard__choice {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 0;
  padding: 4px 9px;
  background: #050706;
  color: #d8dfdb;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 1px;
}

.match-scoreboard__clock { grid-area: clock; border-left: 1px solid rgba(255,255,255,.18); }
.match-scoreboard__choice { grid-area: choice; border-left: 1px solid rgba(255,255,255,.16); }
.match-scoreboard__clock strong,
.match-scoreboard__choice strong {
  color: #fff;
  font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
  font-size: 15px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.match-scoreboard__choice strong.is-urgent { color: #ff7f72; animation: matchday-clock-pulse .75s ease-in-out infinite alternate; }
@keyframes matchday-clock-pulse { to { text-shadow: 0 0 12px rgba(255,80,70,.9); } }

.match-team {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  min-height: 56px;
  padding: 8px 12px;
  background: linear-gradient(180deg, #292e2c, #121514);
}
.match-team--home { grid-area: home; justify-content: flex-end; border-right: 1px solid rgba(255,255,255,.12); }
.match-team--away { grid-area: away; justify-content: flex-start; border-left: 1px solid rgba(255,255,255,.12); }
.match-team__crest {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #f3f4ef;
  color: #121413;
  font-size: 16px;
  box-shadow: 0 0 0 2px rgba(255,255,255,.42);
}
.match-team__name {
  overflow: hidden;
  color: #fff;
  font-family: var(--font-display);
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 900;
  letter-spacing: 1px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.match-scoreboard__score {
  grid-area: score;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-width: 132px;
  padding: 5px 13px;
  background: #f7f7f1;
  color: #0b0d0c;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
}
.match-scoreboard__number {
  min-width: 37px;
  font-family: var(--font-display);
  font-size: clamp(39px, 4.6vw, 53px);
  line-height: .95;
  letter-spacing: 1px;
  text-align: center;
}
.match-scoreboard__separator { color: #59615d; font-size: 27px; font-weight: 950; }

.match-scoreboard__status {
  grid-area: status;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 25px;
  padding: 4px 10px;
  background: #090b0a;
  color: var(--brass-light);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.2px;
  text-align: center;
  white-space: nowrap;
}
.match-scoreboard__status::before {
  content: '●';
  margin-right: 6px;
  color: #66d17a;
  font-size: 9px;
  text-shadow: 0 0 7px rgba(102,209,122,.8);
}
.match-scoreboard--penalties .match-scoreboard__competition { background: linear-gradient(90deg, #76231f, #a23b32 50%, #76231f); }
.match-scoreboard--penalties .match-scoreboard__status::before { content: '⚽'; color: inherit; text-shadow: none; }

.matchday-kickoff {
  position: fixed;
  z-index: 2500;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, rgba(12,58,40,.76), rgba(4,7,6,.94));
  color: #fff8df;
  font-family: var(--font-display);
  font-size: clamp(96px, 26vw, 240px);
  font-weight: 950;
  letter-spacing: .04em;
  text-shadow: 0 8px 34px #000, 0 0 38px rgba(232,195,122,.42);
  pointer-events: all;
  animation: matchday-kickoff-pop .64s ease both;
}
.matchday-kickoff[data-step='3'] { font-size: clamp(58px, 15vw, 128px); }
@keyframes matchday-kickoff-pop {
  0% { opacity: 0; transform: scale(.65); }
  28%, 74% { opacity: 1; transform: scale(1); }
  100% { opacity: .94; transform: scale(1.03); }
}
.matchday-kickoff-active #table { pointer-events: none; }

.timed-mode-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 10px 0 14px;
  padding: 10px 12px;
  border: 1px solid rgba(232,195,122,.32);
  border-radius: 12px;
  background: rgba(0,0,0,.2);
  color: var(--cream);
  font-size: 12px;
  font-weight: 850;
  cursor: pointer;
}
.timed-mode-toggle input { width: 18px; height: 18px; accent-color: var(--brass); }

.final-score[data-sports-scoreboard='true'] {
  width: min(520px, 100%);
  display: grid;
  grid-template-columns: minmax(80px,1fr) auto minmax(70px,1fr);
  align-items: center;
  gap: 8px;
  margin: 16px auto;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,.76);
  border-radius: 9px;
  background: #090b0a;
  box-shadow: 0 9px 27px rgba(0,0,0,.55);
}
.final-score__team { padding: 11px 8px; color: #fff; font-size: clamp(12px,2.6vw,18px); font-weight: 950; text-align: center; }
.final-score__numbers { padding: 8px 15px; background: #f5f5ef; color: #101211; font-size: clamp(40px,8vw,64px); line-height: 1; }
.final-score__time { grid-column: 1 / -1; padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.15); color: var(--brass-light); font-family: ui-monospace, Consolas, monospace; font-size: 12px; text-align: center; }
.result-panel--tie h1 { color: var(--tie); }

@media (max-width: 900px) {
  .score-strip { min-width: 0; width: 100%; }
  .match-scoreboard { width: 100%; }
}

@media (max-width: 620px) {
  .score-strip { grid-column: 1 / -1; width: 100%; }
  .match-scoreboard {
    width: 100%;
    grid-template-columns: minmax(74px, 1fr) minmax(100px, auto) minmax(66px, 1fr);
  }
  .match-scoreboard__competition { min-height: 20px; padding: 3px 6px; font-size: 8px; letter-spacing: 1.2px; }
  .match-scoreboard__clock, .match-scoreboard__choice { gap: 4px; padding: 3px 5px; font-size: 6px; }
  .match-scoreboard__clock strong, .match-scoreboard__choice strong { font-size: 11px; }
  .match-team { min-height: 45px; padding: 5px; gap: 4px; }
  .match-team__crest { width: 22px; height: 22px; font-size: 11px; }
  .match-team__name { font-size: clamp(9px,2.8vw,13px); letter-spacing: .4px; }
  .match-scoreboard__score { min-width: 100px; padding: 3px 7px; gap: 5px; }
  .match-scoreboard__number { min-width: 28px; font-size: clamp(34px,10vw,44px); }
  .match-scoreboard__separator { font-size: 21px; }
  .match-scoreboard__status { min-height: 21px; padding: 3px 5px; font-size: 7px; letter-spacing: .6px; overflow: hidden; text-overflow: ellipsis; }
  .final-score[data-sports-scoreboard='true'] { grid-template-columns: minmax(58px,1fr) auto minmax(50px,1fr); }
  .final-score__team { padding-inline: 4px; font-size: 11px; }
  .final-score__numbers { padding-inline: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .matchday-kickoff { animation: none; }
  .match-scoreboard__choice strong.is-urgent { animation: none; }
}
