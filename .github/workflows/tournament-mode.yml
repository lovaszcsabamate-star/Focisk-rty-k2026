name: Torna mód ellenőrzése

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tournament-mode.yml'
      - 'index.html'
      - 'css/tournament-mode.css'
      - 'js/bootstrap.js'
      - 'js/app/result-controller.js'
      - 'js/tournament-mode.js'
      - 'js/tournament-cup-experience.js'
      - 'js/tournament-experience-v2.js'
      - 'js/tournament/**'
      - 'js/services/tournament-storage-service.js'
      - 'js/domain/quick-match-domain.js'
      - 'js/services/quick-match-storage-service.js'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'scripts/postprocess-standalone.mjs'
      - 'scripts/tournament-ui-mobile-smoke.mjs'
      - 'test/tournament-mode.test.mjs'
      - 'test/tournament-statistics.test.mjs'
      - 'test/tournament-cup-experience.test.mjs'
      - 'test/tournament-ui-improvement.test.mjs'
      - 'test/result-controller.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tournament-mode.yml'
      - 'index.html'
      - 'css/tournament-mode.css'
      - 'js/bootstrap.js'
      - 'js/app/result-controller.js'
      - 'js/tournament-mode.js'
      - 'js/tournament-cup-experience.js'
      - 'js/tournament-experience-v2.js'
      - 'js/tournament/**'
      - 'js/services/tournament-storage-service.js'
      - 'js/domain/quick-match-domain.js'
      - 'js/services/quick-match-storage-service.js'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'scripts/postprocess-standalone.mjs'
      - 'scripts/tournament-ui-mobile-smoke.mjs'
      - 'test/tournament-mode.test.mjs'
      - 'test/tournament-statistics.test.mjs'
      - 'test/tournament-cup-experience.test.mjs'
      - 'test/tournament-ui-improvement.test.mjs'
      - 'test/result-controller.test.mjs'

permissions:
  contents: read

concurrency:
  group: tournament-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Függőségek telepítése
        run: npm ci

      - name: Új modulok szintaktikai ellenőrzése
        run: |
          node --check js/tournament/tournament-domain.js
          node --check js/services/tournament-storage-service.js
          node --check js/tournament-mode.js
          node --check js/tournament-cup-experience.js
          node --check js/tournament/tournament-experience-v2-runtime.js
          node --check js/tournament/tournament-ui-improvement.js
          node --check js/tournament-experience-v2.js
          node --check js/app/result-controller.js
          node --check js/bootstrap.js
          node --check scripts/build-standalone-with-settings.mjs
          node --check scripts/postprocess-standalone.mjs
          node --check scripts/tournament-ui-mobile-smoke.mjs
          node --check test/tournament-mode.test.mjs
          node --check test/tournament-statistics.test.mjs
          node --check test/tournament-cup-experience.test.mjs
          node --check test/tournament-ui-improvement.test.mjs
          node --check test/result-controller.test.mjs

      - name: Torna domain regressziós teszt
        run: node test/tournament-mode.test.mjs

      - name: Torna statisztikai regresszió
        run: node test/tournament-statistics.test.mjs

      - name: Strukturált eredmény regresszió
        run: node test/result-controller.test.mjs

      - name: Kupaélmény integrációs teszt
        run: node test/tournament-cup-experience.test.mjs

      - name: Klubcímer és Torna UI regresszió
        run: node test/tournament-ui-improvement.test.mjs

      - name: Önálló játék összeállítása
        run: npm run build

      - name: Torna UI valódi mobil böngészőteszt
        run: node scripts/tournament-ui-mobile-smoke.mjs

      - name: Torna mód ellenőrzése az önálló buildben
        run: |
          test -s Fociskartyak2026.html
          grep -q 'Torna mód' Fociskartyak2026.html
          grep -q 'tournamentStorageService' Fociskartyak2026.html
          grep -q 'tournament-bracket' Fociskartyak2026.html
          grep -q 'tournament-format-showcase' Fociskartyak2026.html
          grep -q 'tournament-final-intro' Fociskartyak2026.html
          grep -q 'TOURNAMENT_FORMAT' Fociskartyak2026.html
          grep -q 'TOURNAMENT_STATISTICS_VERSION' Fociskartyak2026.html
          grep -q 'Leggyakoribb kategóriák' Fociskartyak2026.html
          grep -q 'TOURNAMENT_UI_IMPROVEMENT_VERSION' Fociskartyak2026.html
          grep -q 'PAFC' Fociskartyak2026.html

      - name: Mobil webcsomag előkészítése
        run: node scripts/prepare-mobile.mjs

      - name: Torna mód ellenőrzése a mobilcsomagban
        run: |
          test -s mobile-www/index.html
          grep -q 'Torna mód' mobile-www/index.html
          grep -q 'tournamentStorageService' mobile-www/index.html
          grep -q 'tournament-bracket' mobile-www/index.html
          grep -q 'tournament-format-showcase' mobile-www/index.html
          grep -q 'tournament-final-intro' mobile-www/index.html
          grep -q 'TOURNAMENT_STATISTICS_VERSION' mobile-www/index.html
          grep -q 'Leggyakoribb kategóriák' mobile-www/index.html
          grep -q 'TOURNAMENT_UI_IMPROVEMENT_VERSION' mobile-www/index.html
