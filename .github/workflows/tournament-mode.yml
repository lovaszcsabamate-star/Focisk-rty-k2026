name: Torna mód ellenőrzése

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tournament-mode.yml'
      - 'index.html'
      - 'css/tournament-mode.css'
      - 'js/bootstrap.js'
      - 'js/tournament-mode.js'
      - 'js/tournament/**'
      - 'js/services/tournament-storage-service.js'
      - 'js/domain/quick-match-domain.js'
      - 'js/services/quick-match-storage-service.js'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'test/tournament-mode.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tournament-mode.yml'
      - 'index.html'
      - 'css/tournament-mode.css'
      - 'js/bootstrap.js'
      - 'js/tournament-mode.js'
      - 'js/tournament/**'
      - 'js/services/tournament-storage-service.js'
      - 'js/domain/quick-match-domain.js'
      - 'js/services/quick-match-storage-service.js'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'test/tournament-mode.test.mjs'

permissions:
  contents: read

concurrency:
  group: tournament-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Függőségek telepítése
        run: npm ci

      - name: Új modulok szintaktikai ellenőrzése
        run: |
          node --check js/tournament/tournament-domain.js
          node --check js/services/tournament-storage-service.js
          node --check js/tournament-mode.js
          node --check js/bootstrap.js
          node --check scripts/build-standalone-with-settings.mjs
          node --check test/tournament-mode.test.mjs

      - name: Torna domain regressziós teszt
        run: node test/tournament-mode.test.mjs

      - name: Önálló játék összeállítása
        run: npm run build

      - name: Torna mód ellenőrzése az önálló buildben
        run: |
          test -s Fociskartyak2026.html
          grep -q 'Torna mód' Fociskartyak2026.html
          grep -q 'tournamentStorageService' Fociskartyak2026.html
          grep -q 'tournament-bracket' Fociskartyak2026.html
          grep -q 'TOURNAMENT_FORMAT' Fociskartyak2026.html

      - name: Mobil webcsomag előkészítése
        run: node scripts/prepare-mobile.mjs

      - name: Torna mód ellenőrzése a mobilcsomagban
        run: |
          test -s mobile-www/index.html
          grep -q 'Torna mód' mobile-www/index.html
          grep -q 'tournamentStorageService' mobile-www/index.html
          grep -q 'tournament-bracket' mobile-www/index.html
