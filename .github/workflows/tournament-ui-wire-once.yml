name: Tournament UI one-shot wiring

on:
  push:
    branches:
      - feat/tournament-ui-club-crests
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message || '', '[tournament-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournament-ui-club-crests
          fetch-depth: 0
      - name: Wire browser, standalone and PWA entry points
        run: |
          python - <<'PY'
          from pathlib import Path

          entry_path = Path('js/tournament-experience-v2.js')
          entry = entry_path.read_text(encoding='utf-8')
          import_line = "import { installTournamentUiImprovement } from './tournament/tournament-ui-improvement.js';\n"
          if import_line not in entry:
              anchor = "import { showExperienceWizard } from './tournament/tournament-experience-v2-wizard.js';\n"
              if anchor not in entry:
                  raise SystemExit('Nem található a Torna v2 import beszúrási pontja.')
              entry = entry.replace(anchor, anchor + import_line, 1)
          call_line = 'installTournamentUiImprovement();'
          if call_line not in entry:
              anchor = 'installCupSelectorV3();\n'
              if anchor not in entry:
                  raise SystemExit('Nem található a Torna v2 bootstrap beszúrási pontja.')
              entry = entry.replace(anchor, anchor + call_line + '\n', 1)
          entry_path.write_text(entry, encoding='utf-8')

          standalone_path = Path('scripts/postprocess-standalone.mjs')
          standalone = standalone_path.read_text(encoding='utf-8')
          module_line = "  path.join(ROOT, 'js/tournament/tournament-ui-improvement.js'),\n"
          if module_line not in standalone:
              anchor = "  path.join(ROOT, 'js/tournament/tournament-experience-v2-runtime.js'),\n"
              if anchor not in standalone:
                  raise SystemExit('Nem található a standalone Torna v2 modul-lista beszúrási pontja.')
              standalone = standalone.replace(anchor, anchor + module_line, 1)
          standalone_path.write_text(standalone, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          core_line = "  './js/tournament/tournament-ui-improvement.js',\n"
          if core_line not in sw:
              anchor = "  './js/tournament/tournament-experience-v2-runtime.js',\n"
              if anchor not in sw:
                  raise SystemExit('Nem található a PWA CORE Torna v2 beszúrási pontja.')
              sw = sw.replace(anchor, anchor + core_line, 1)
          sw_path.write_text(sw, encoding='utf-8')
          PY
      - name: Verify wiring
        run: |
          grep -q "tournament/tournament-ui-improvement.js" js/tournament-experience-v2.js
          grep -q "installTournamentUiImprovement();" js/tournament-experience-v2.js
          grep -q "tournament/tournament-ui-improvement.js" scripts/postprocess-standalone.mjs
          grep -q "./js/tournament/tournament-ui-improvement.js" sw.js
          node test/tournament-ui-improvement.test.mjs
          git diff --check
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "Nincs új bekötési módosítás."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/tournament-experience-v2.js scripts/postprocess-standalone.mjs sw.js
          git commit -m "feat(tournament): wire club crest UI enhancer [tournament-ui-patch]"
          git push origin HEAD:feat/tournament-ui-club-crests
