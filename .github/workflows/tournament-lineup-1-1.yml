name: Tournament Lineup 1.1 release gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tournament-lineup-1-1.yml'
      - 'js/tournament-mode.js'
      - 'js/tournament/tournament-lineup-controller.js'
      - 'js/tournament/tournament-lineup-state.js'
      - 'js/services/tournament-storage-service.js'
      - 'js/deck-selection.js'
      - 'js/penalties.js'
      - 'css/tournament-mode.css'
      - 'scripts/build-standalone-with-settings.mjs'
      - 'sw.js'
      - 'test/tournament-lineup-state.test.mjs'
      - 'test/tournament-lineup-ui.test.mjs'
      - 'test/tournament-lineup-matchday.test.mjs'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lineup 1.1 syntax
        run: |
          node --check js/tournament/tournament-lineup-controller.js
          node --check js/tournament/tournament-lineup-state.js
          node --check js/tournament-mode.js
          node --check js/services/tournament-storage-service.js
          node --check js/deck-selection.js
          node --check js/penalties.js
          node --check test/tournament-lineup-state.test.mjs
          node --check test/tournament-lineup-ui.test.mjs
          node --check test/tournament-lineup-matchday.test.mjs
      - name: Matchday and Torna regression
        run: |
          node test/tournament-lineup-state.test.mjs
          node test/tournament-lineup-ui.test.mjs
          node test/tournament-lineup-matchday.test.mjs
          node test/tournament-mode.test.mjs
          node test/tournament-statistics.test.mjs
          node test/tournament-launch-transaction.test.mjs
          node test/result-controller.test.mjs
      - name: Full project regression
        run: |
          npm run lint
          npm test
          npm run test:all
      - name: Build, standalone and offline
        run: |
          npm run build
          npm run build:standalone
          npm run audit:pwa
          npm run test:pwa-cache
      - name: Mobile widths and runtime
        run: |
          npm run mobile:prepare
          npm run test:mobile-layout
          npm run test:runtime

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:prepare
      - run: npx cap add android
      - run: npx cap sync android
      - name: Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fociskartyak2026-Tournament-Lineup-1.1-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
