name: Package lock egyszeri szinkronizálása

on:
  push:
    branches:
      - feature/quick-match-card-controls

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4
        with:
          ref: feature/quick-match-card-controls
          fetch-depth: 0

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Package lock frissítése
        run: npm install --package-lock-only --ignore-scripts

      - name: Módosítás mentése
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "A package-lock.json már szinkronban van."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Package lock verzió szinkronizálása"
          git push origin HEAD:feature/quick-match-card-controls
