name: Apply runtime smoke timeout

on:
  push:
    branches:
      - fix/chrome-smoke-timeouts
    paths:
      - .github/workflows/apply-runtime-smoke-timeout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chrome-smoke-timeouts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded full-runtime timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/runtime-browser-smoke.mjs')
          s = p.read_text()
          old = "  ], { encoding: 'utf8', maxBuffer: 30 * 1024 * 1024 });"
          new = "  ], { encoding: 'utf8', timeoutMs: 45_000, maxBuffer: 30 * 1024 * 1024 });"
          if old not in s:
              raise SystemExit('A runtime Chrome hívás várt alakja nem található.')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/runtime-browser-smoke.mjs
          node test/chrome-smoke-runner.test.mjs
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-runtime-smoke-timeout.yml
          git add scripts/runtime-browser-smoke.mjs
          git commit -m "Adj hideg runnerre biztonságos runtime Chrome timeoutot"
          git push origin HEAD:fix/chrome-smoke-timeouts
