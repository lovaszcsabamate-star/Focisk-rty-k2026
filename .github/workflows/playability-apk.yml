name: Playability upgrade APK

on:
  push:
    branches:
      - feat/playability-visual-upgrade-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java beállítása
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Függőségek telepítése
        run: npm ci

      - name: Új fejlesztési réteg ellenőrzése
        run: |
          node --check js/playability-visual-upgrade.js
          node test/playability-visual-upgrade.test.mjs

      - name: Teljes lint és regressziós teszt
        run: |
          npm run lint
          npm test

      - name: Android projekt és mobilcsomag elkészítése
        run: npm run mobile:add:android

      - name: Fociskártyák alkalmazásikon alkalmazása
        run: node scripts/apply-android-icon.mjs

      - name: Android alkalmazásikon ellenőrzése
        run: |
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml

      - name: Debug APK fordítása
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Kiadási fájlok előkészítése
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Fociskartyak2026-playability-debug.apk
          cp Fociskartyak2026.html release/Fociskartyak2026.html

      - name: APK és önálló játék feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: Fociskartyak2026-playability-apk
          path: release/*
          if-no-files-found: error
          retention-days: 14
