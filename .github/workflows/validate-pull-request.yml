name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: beta-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Beta release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js 22 beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reprodukálható függőségtelepítés
        run: npm ci

      - name: Központi lint
        run: npm run lint

      - name: Újabb játék- és mobilmodulok szintaktikai ellenőrzése
        run: |
          node --check js/domain/quick-match-domain.js
          node --check js/services/quick-match-storage-service.js
          node --check js/services/tournament-storage-service.js
          node --check js/tournament/tournament-domain.js
          node --check js/tournament-mode.js
          node --check js/tournament-cup-experience.js
          node --check scripts/mobile-runtime-smoke.mjs
          node --check test/quick-match-autostart.test.mjs
          node --check test/deck-selection-transaction.test.mjs
          node --check test/tournament-mode.test.mjs
          node --check test/tournament-cup-experience.test.mjs
          node --check test/tournament-launch-transaction.test.mjs

      - name: Tranzakciós indítási regressziók
        run: |
          node test/deck-selection-transaction.test.mjs
          node test/quick-match-autostart.test.mjs
          node test/tournament-launch-transaction.test.mjs

      - name: Alap teljes tesztcsomag
        run: npm test

      - name: Kibővített teljes tesztcsomag
        run: npm run test:all

      - name: Akadálymentességi regresszió
        run: npm run test:accessibility

      - name: PWA shell audit
        run: npm run audit:pwa

      - name: PWA cache regresszió
        run: npm run test:pwa-cache

      - name: Production build
        run: npm run build

      - name: Önálló build
        run: npm run build:standalone

      - name: Mobil webcsomag előkészítése
        run: npm run mobile:prepare

      - name: Mobil elrendezési ellenőrzések
        run: npm run test:mobile-layout

      - name: Valódi böngészős runtime smoke
        run: npm run test:runtime

      - name: Mobil runtime smoke
        run: node scripts/mobile-runtime-smoke.mjs

      - name: Torna végponttól végpontig regresszió
        run: |
          node test/tournament-mode.test.mjs
          node test/tournament-cup-experience.test.mjs

      - name: Buildkimenetek ellenőrzése
        run: |
          test -s Fociskartyak2026.html
          test -s mobile-www/index.html
          grep -q 'Torna mód' Fociskartyak2026.html
          grep -q 'tournamentStorageService' Fociskartyak2026.html

      - name: Formázási regressziók
        run: git diff --check
