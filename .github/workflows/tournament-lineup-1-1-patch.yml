name: Tournament Lineup 1.1 patch

on:
  push:
    branches: [feature/tournament-lineup-1-1]
    paths:
      - '.github/workflows/tournament-lineup-1-1-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-lineup-1-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Torna center and CSS
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const modePath = 'js/tournament-mode.js';
          let mode = fs.readFileSync(modePath, 'utf8');
          const storageImport = "import { tournamentStorageService } from './services/tournament-storage-service.js';";
          const lineupImport = "import { storedTournamentLineup } from './tournament/tournament-lineup-state.js';";
          if (!mode.includes(lineupImport)) {
            if (!mode.includes(storageImport)) throw new Error('Tournament storage import anchor missing');
            mode = mode.replace(storageImport, `${storageImport}\n${lineupImport}`);
          }

          const roundAnchor = "  const round = nextMatch ? state.rounds.find(item => item.matches?.some(match => match.id === nextMatch.id)) : null;";
          const readinessBlock = `${roundAnchor}\n  const nextMatchMode = nextMatch?.status === TOURNAMENT_MATCH_STATUS.TIEBREAK ? TOURNAMENT_MATCH_MODE.PENALTIES : state.matchMode;\n  const humanCards = human ? resolveQuickMatchSelection(players(), human.selection) : [];\n  const hasLastLineup = storedTournamentLineup(state, 'last', humanCards).length === 11;`;
          if (!mode.includes('const hasLastLineup = storedTournamentLineup')) {
            if (!mode.includes(roundAnchor)) throw new Error('Tournament center round anchor missing');
            mode = mode.replace(roundAnchor, readinessBlock);
          }

          const playButton = '<button class="btn tournament-play" id="tournament-play">▶ Keret összeállítása</button>';
          const polishedPlay = `<div class="tournament-next-match-meta" aria-label="Következő mérkőzés részletei"><span>${'${escapeHtml(matchModeLabel(nextMatchMode))}'}</span>${'${hasLastLineup ? \'<span class="is-ready">✓ Legutóbbi keret elérhető</span>\' : \'<span>Új keret összeállítása</span>\'}'}</div><button class="btn tournament-play" id="tournament-play">▶ Keret összeállítása</button>`;
          if (!mode.includes('tournament-next-match-meta')) {
            if (!mode.includes(playButton)) throw new Error('Tournament play button anchor missing');
            mode = mode.replace(playButton, polishedPlay);
          }
          fs.writeFileSync(modePath, mode);

          const cssPath = 'css/tournament-mode.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const marker = '/* Tournament Lineup 1.1 — next match readiness */';
          if (!css.includes(marker)) {
            css += `\n\n${marker}\n.tournament-next-match-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0 2px}.tournament-next-match-meta span{min-height:32px;display:inline-flex;align-items:center;padding:5px 9px;border:1px solid rgba(255,239,183,.16);border-radius:999px;background:rgba(255,255,255,.045);color:#d9c9a7;font-size:.78rem;font-weight:850}.tournament-next-match-meta .is-ready{border-color:rgba(93,217,123,.48);background:rgba(61,174,92,.16);color:#d4ffdc}\n@media(max-width:420px){.tournament-next-match-meta{display:grid;grid-template-columns:1fr}.tournament-next-match-meta span{justify-content:center}}\n`;
          }
          fs.writeFileSync(cssPath, css);
          NODE
          node --check js/tournament-mode.js
          node --check js/tournament/tournament-lineup-controller.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/tournament-mode.js css/tournament-mode.css
          if git diff --cached --quiet; then
            echo 'No patch needed.'
          else
            git commit -m 'feat(lineup): show matchday readiness in tournament center'
            git push origin HEAD:feature/tournament-lineup-1-1
          fi
