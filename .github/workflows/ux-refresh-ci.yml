name: UX refresh validation

on:
  push:
    branches:
      - feature/ux-refresh-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Függőségek telepítése
        run: npm install

      - name: Új ellenőrző fájlok szintaxisa
        run: |
          node --check scripts/ux-refresh-previews.mjs
          node --check test/visible-mode-name.test.mjs

      - name: Közvetlen magyar elnevezések
        run: node test/visible-mode-name.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Alap tesztsor
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Mobil elrendezési tesztek
        if: always()
        run: |
          set -o pipefail
          npm run test:mobile-layout 2>&1 | tee mobile-layout-test.log

      - name: Böngészős futásidejű teszt
        if: always()
        run: |
          set -o pipefail
          npm run test:runtime 2>&1 | tee runtime-test.log

      - name: Teljes tesztsor
        if: always()
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee test-all.log

      - name: UX mobil- és asztali előnézetek
        if: always()
        run: |
          set -o pipefail
          node scripts/ux-refresh-previews.mjs 2>&1 | tee ux-preview.log

      - name: Előnézetek, naplók és jelentések feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fociskartyak-ux-refresh-previews
          if-no-files-found: warn
          retention-days: 14
          path: |
            previews/*.png
            mobile-layout-report.json
            ux-refresh-preview-report.json
            Fociskartyak2026.html
            npm-test.log
            mobile-layout-test.log
            runtime-test.log
            test-all.log
            ux-preview.log
