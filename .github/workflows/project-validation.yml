name: Project validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck when configured
        run: npm run typecheck --if-present

      - name: Player profile tests
        run: node test/player-profile.test.mjs

      - name: Interface regression tests
        run: node test/interface-regression.test.mjs

      - name: Full test suite
        run: npm test

      - name: Build
        if: always()
        run: npm run build
