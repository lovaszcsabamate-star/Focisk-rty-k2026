name: Nationality diagnostics fast

on:
  pull_request:
    paths:
      - 'js/data/nationalities.js'
      - 'js/models/player-model.js'
      - 'data/**'
      - 'scripts/audit-nationalities.mjs'
      - 'test/nationalities.test.mjs'
      - '.github/workflows/nationality-diagnostics-fast.yml'

jobs:
  audit-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Run focused nationality audit
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch fix/nationality-flags-2026 https://github.com/lovaszcsabamate-star/Focisk-rty-k2026.git repo
          cd repo
          node scripts/migrate-normalized-database.mjs >/dev/null
          node scripts/audit-nationalities.mjs >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('data/databases/hungary-nb1-2025-26/nationality-audit-report.json', 'utf8'));
          console.log(JSON.stringify({
            checkedPlayers: report.checkedPlayers,
            correctedAssignments: report.correctedAssignments,
            corrections: report.corrections,
            validFlagCount: report.validFlagCount,
            fallbackIconCount: report.fallbackIconCount,
            everyPlayerHasValidFlagOrFallback: report.everyPlayerHasValidFlagOrFallback,
            missingNationality: report.missingNationality,
            missingCountryCode: report.missingCountryCode,
            unknownCountryCode: report.unknownCountryCode,
            britishMisassignments: report.britishMisassignments,
            contradictions: report.contradictions,
            summary: report.summary,
          }, null, 2));
          NODE
          node test/nationalities.test.mjs
