name: Test tail diagnostics

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.json'
      - 'index.html'
      - 'css/**'
      - '.github/workflows/test-tail.yml'

jobs:
  test-tail:
    runs-on: ubuntu-latest
    steps:
      - name: Full test with concise failure output
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch fix/nationality-flags-2026 https://github.com/lovaszcsabamate-star/Focisk-rty-k2026.git repo
          cd repo
          npm ci --silent
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          tail -n 160 /tmp/full-test.log
          exit $status
